name: Code Integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js scripts/*.mjs; do
            node --check "$file"
          done
      - name: Check model assets and module links
        run: node scripts/check-project.mjs
      - name: Check nest reconnaissance lifecycle
        run: node scripts/check-nest-recon.mjs
